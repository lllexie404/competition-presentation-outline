const books=[{"volume":1,"title":"延世韩国语 1","subtitle":"初级生存韩语与 TOPIK 基础","topikStage":"TOPIK I · 基础阶段","available":true,"lessons":[{"id":1,"ko":"인사","zh":"问候","color":"#ff7b64","goal":"打招呼、介绍姓名、国籍与职业","topikTargets":["基础身份信息","助词 은/는、이/가","简短对话应答"],"words":[{"ko":"안녕하세요","zh":"你好","romanization":"annyeonghaseyo","pos":"惯用语"},{"ko":"이름","zh":"名字","romanization":"ireum","pos":"名词"},{"ko":"학생","zh":"学生","romanization":"haksaeng","pos":"名词"},{"ko":"나라","zh":"国家","romanization":"nara","pos":"名词"},{"ko":"반갑습니다","zh":"很高兴见到你","romanization":"bangapseumnida","pos":"惯用语"},{"ko":"선생님","zh":"老师","romanization":"seonsaengnim","pos":"名词"},{"ko":"회사원","zh":"公司职员","romanization":"hoesawon","pos":"名词"},{"ko":"한국 사람","zh":"韩国人","romanization":"hanguk saram","pos":"名词"}],"grammar":[{"form":"N은/는 N이에요/예요","title":"判断句与话题助词","meaning":"用来说明“某人/某物是什么”，相当于中文“是……”。은/는 把名词设为本句话题。","formation":["名词有收音：N + 은 / N + 이에요","名词无收音：N + 는 / N + 예요","저 + 는 → 저는；학생 + 이에요 → 학생이에요"],"usage":"初次自我介绍、说明职业或国籍时最常用。이에요/예요 是礼貌口语；正式场合可用 입니다。","examples":[{"ko":"저는 중국 사람이에요.","zh":"我是中国人。"},{"ko":"민수는 학생이에요.","zh":"敏洙是学生。"}],"pitfall":"不要写成 학생예요。有收音的 학생 必须接 이에요。은/는 的选择也看前一名词有没有收音。","comparison":"은/는 强调话题或对比；이/가 强调主语或新信息。","topikTip":"TOPIK I 常在填空题中同时考查话题助词和 이에요/예요 的接续。先看空格前名词是否有收音。"},{"form":"N이/가 아니에요","title":"名词否定","meaning":"表示“不是……”。아니에요 前面的名词要接主格助词 이/가。","formation":["名词有收音：N + 이 아니에요","名词无收音：N + 가 아니에요","학생 + 이 아니에요；의사 + 가 아니에요"],"usage":"否定身份、类别或事物名称。回答“是不是……”时也常用。","examples":[{"ko":"저는 선생님이 아니에요.","zh":"我不是老师。"},{"ko":"이것은 제 책이 아니에요.","zh":"这不是我的书。"}],"pitfall":"아니예요 是常见错写，标准写法是 아니에요。不要把 은/는 直接接在 아니에요 前代替 이/가。","comparison":"안 + 动词/形容词否定动作或性质；이/가 아니에요 专门否定名词。","topikTip":"看到“不是”类中文或 대화中的 아니요，重点检查 이/가 与 아니에요。"}],"questions":[{"id":"1-1","type":"语法","difficulty":"基础","prompt":"“我是学生”最自然的表达是？","promptKo":"‘저는 학생입니다’라는 뜻을 가장 자연스럽게 표현한 것을 고르세요.","promptZh":"“我是学生”最自然的表达是？","options":["저는 학생이에요.","저는 학생예요.","저가 학생이에요.","저는 학생을 가요."],"answer":0,"explanation":"학생 有收音，要接 이에요；自我介绍以 저는 开头。"},{"id":"1-2","type":"词汇","difficulty":"基础","prompt":"처음 뵙겠습니다. ______.","promptKo":"빈칸에 알맞은 말을 고르세요. 처음 뵙겠습니다. ______.","promptZh":"请选择适合填入空格的表达：初次见面。______。","options":["반갑습니다","미안합니다","잘 먹겠습니다","다녀오겠습니다"],"answer":0,"explanation":"初次见面时用 반갑습니다，表示“很高兴见到你”。"},{"id":"1-3","type":"语法","difficulty":"TOPIK","prompt":"빈칸에 알맞은 것을 고르세요. 저는 의사___ 아니에요.","promptKo":"빈칸에 알맞은 것을 고르세요. 저는 의사___ 아니에요.","promptZh":"请选择适合填入空格的助词：我不是医生。","options":["는","를","가","에"],"answer":2,"explanation":"의사 没有收音，否定名词时用 의사+가 아니에요。"},{"id":"1-4","type":"阅读","difficulty":"TOPIK","prompt":"根据对话，关于“나”的说明正确的是？","promptKo":"대화를 읽고 ‘나’에 대한 설명으로 맞는 것을 고르세요.","promptZh":"根据对话，关于“나”的说明正确的是？","options":["학생입니다.","중국 사람입니다.","선생님입니다.","한국 사람입니다."],"answer":1,"explanation":"对话直接给出中国人这一身份信息。TOPIK 阅读先定位疑问词 어느 나라。","material":"가: 어느 나라 사람이에요?\n나: 중국 사람이에요.","materialLabel":"对话材料"},{"id":"1-5","type":"听力","difficulty":"TOPIK","prompt":"音频内容与哪项相符？","promptKo":"다음을 듣고 들은 내용과 같은 것을 고르세요.","promptZh":"音频内容与哪项相符？","options":["说话人是老师。","说话人不是学生。","说话人是学生。","说话人是医生。"],"answer":2,"explanation":"저는 학생이에요 表示“我是学生”。","audio":"안녕하세요. 저는 리밍이에요. 학생이에요."}]},{"id":2,"ko":"학교와 집","zh":"学校与家","color":"#f2b94b","goal":"指认物品、询问地点、说明存在","topikTargets":["场所与方位词","이/그/저 指示","存在句 있어요/없어요"],"words":[{"ko":"학교","zh":"学校","romanization":"hakgyo","pos":"名词"},{"ko":"교실","zh":"教室","romanization":"gyosil","pos":"名词"},{"ko":"책상","zh":"书桌","romanization":"chaeksang","pos":"名词"},{"ko":"의자","zh":"椅子","romanization":"uija","pos":"名词"},{"ko":"집","zh":"家","romanization":"jip","pos":"名词"},{"ko":"어디","zh":"哪里","romanization":"eodi","pos":"疑问词"},{"ko":"위","zh":"上面","romanization":"wi","pos":"方位词"},{"ko":"옆","zh":"旁边","romanization":"yeop","pos":"方位词"}],"grammar":[{"form":"이/그/저 N","title":"指示词：这/那","meaning":"根据物品与说话双方的距离选择 이、그、저。","formation":["靠近说话者：이 + 名词","靠近听话者或前文已提到：그 + 名词","远离双方：저 + 名词","单独使用：이것 / 그것 / 저것"],"usage":"介绍物品、询问名称或在阅读中指代前文信息。","examples":[{"ko":"이 책은 한국어 책이에요.","zh":"这本书是韩语书。"},{"ko":"저 건물은 도서관이에요.","zh":"那栋楼是图书馆。"}],"pitfall":"그 不只是空间上的“那个”，阅读中还常指代刚刚提过的事物。不要把 이/그/저 单独当名词使用。","comparison":"여기/거기/저기 是地点副词；이것/그것/저것 是代词。","topikTip":"TOPIK 阅读常用 그 사람、그곳、그날回指前文，先找它指向的内容。"},{"form":"N에 있어요/없어요","title":"存在与位置","meaning":"表示某人或某物在/不在某地点。地点后用 에，存在主体常用 이/가。","formation":["地点 + 에 + 名词 + 이/가 있어요","名词 + 이/가 + 地点 + 에 있어요","否定：있어요 → 없어요"],"usage":"说明位置、询问设施、表达是否拥有。人和物都能用 있지만，敬语中的“在”可用 계세요。","examples":[{"ko":"책이 책상 위에 있어요.","zh":"书在桌子上。"},{"ko":"교실에 학생이 없어요.","zh":"教室里没有学生。"}],"pitfall":"地点存在用 에，不用 에서。에서 表示动作发生的场所，例如 학교에서 공부해요。","comparison":"있어요 也可表示“拥有”：저는 동생이 있어요（我有弟弟/妹妹）。","topikTip":"位置题先区分静态存在 에 和动作地点 에서，这是 TOPIK I 高频考点。"}],"questions":[{"id":"2-1","type":"词汇","difficulty":"基础","prompt":"“洗手间在哪里？”怎么说？","promptKo":"‘화장실이 어디예요?’라는 뜻에 맞는 문장을 고르세요.","promptZh":"“洗手间在哪里？”怎么说？","options":["화장실이 뭐예요?","화장실이 어디예요?","화장실이 누구예요?","화장실이 언제예요?"],"answer":1,"explanation":"询问地点用 어디。"},{"id":"2-2","type":"语法","difficulty":"基础","prompt":"책이 책상 위___ 있어요.","promptKo":"빈칸에 알맞은 조사를 고르세요. 책이 책상 위___ 있어요.","promptZh":"请选择合适的助词：书在桌子上___。","options":["를","에","에서","와"],"answer":1,"explanation":"静态位置用地点助词 에。"},{"id":"2-3","type":"语法","difficulty":"TOPIK","prompt":"교실___ 한국어를 공부해요.","promptKo":"빈칸에 알맞은 조사를 고르세요. 교실___ 한국어를 공부해요.","promptZh":"请选择合适的助词：在教室___学习韩语。","options":["에","에서","이","의"],"answer":1,"explanation":"공부해요 是动作，动作发生的场所用 에서。"},{"id":"2-4","type":"阅读","difficulty":"TOPIK","prompt":"根据句子，选择正确的说明。","promptKo":"문장을 읽고 내용과 같은 것을 고르세요.","promptZh":"根据句子，选择正确的说明。","options":["书包里没有书。","书包里有书和本子。","书在书包旁边。","本子在桌上。"],"answer":1,"explanation":"안에 表示“在里面”，있습니다 表示存在。","material":"가방 안에 책하고 공책이 있습니다.","materialLabel":"阅读材料"},{"id":"2-5","type":"听力","difficulty":"TOPIK","prompt":"听完后选择正确位置。","promptKo":"다음을 듣고 책이 있는 곳을 고르세요.","promptZh":"听完后选择书所在的正确位置。","options":["书在椅子下面。","书在桌子上。","书在书包里。","书在桌子旁。"],"answer":1,"explanation":"책상 위에 表示“在桌子上”。","audio":"책은 책상 위에 있어요."}]},{"id":3,"ko":"가족과 친구","zh":"家人与朋友","color":"#73bd88","goal":"介绍家人、朋友、职业与人物特点","topikTargets":["家庭称谓","所属 의","并列连接 -고"],"words":[{"ko":"가족","zh":"家人","romanization":"gajok","pos":"名词"},{"ko":"부모님","zh":"父母","romanization":"bumonim","pos":"名词"},{"ko":"친구","zh":"朋友","romanization":"chingu","pos":"名词"},{"ko":"형제","zh":"兄弟姐妹","romanization":"hyeongje","pos":"名词"},{"ko":"회사원","zh":"公司职员","romanization":"hoesawon","pos":"名词"},{"ko":"사진","zh":"照片","romanization":"sajin","pos":"名词"},{"ko":"친절하다","zh":"亲切","romanization":"chinjeolhada","pos":"形容词"},{"ko":"재미있다","zh":"有趣","romanization":"jaemiitda","pos":"形容词"}],"grammar":[{"form":"N의 N","title":"所属与修饰","meaning":"表示所属、关系或属性，相当于“……的……”。","formation":["所有者 + 의 + 所属物","저의 → 제；나의 → 내；너의 → 네","口语中 의 常可省略"],"usage":"介绍家人、物品所属、国家或机构关系。의 在口语中常读作 [에]。","examples":[{"ko":"이분은 제 어머니예요.","zh":"这位是我妈妈。"},{"ko":"친구의 전화번호를 알아요.","zh":"我知道朋友的电话号码。"}],"pitfall":"中文里有“的”不代表韩语一定要写 의。固定关系如 우리 학교、한국 음식通常不加 의。","comparison":"우리 在韩语中常表达亲近所属，如 우리 엄마、우리 집，即使中文说“我妈妈”。","topikTip":"阅读题看到 제/내/네，要迅速还原为 저의/나의/너의，判断人物关系。"},{"form":"A/V-고","title":"并列连接：并且","meaning":"连接两个动作、状态或事实，表示“并且、而且”。","formation":["动词/形容词词干 + 고","名词：N이고","时制通常体现在句末谓语"],"usage":"列举人物特点、连续陈述日常活动，不强调动作先后。","examples":[{"ko":"언니는 예쁘고 친절해요.","zh":"姐姐漂亮又亲切。"},{"ko":"저는 밥을 먹고 동생은 커피를 마셔요.","zh":"我吃饭，弟弟/妹妹喝咖啡。"}],"pitfall":"-고 本身不一定表示先后。“吃完再去”更常用 -고 나서；不要见到“然后”都机械使用 -고。","comparison":"-아/어서 常表达原因或紧密先后；-고 更偏平等罗列。","topikTip":"TOPIK 常要求选两个性质自然并列的句子，注意前项不用重复时制。"}],"questions":[{"id":"3-1","type":"词汇","difficulty":"基础","prompt":"“父母”对应的尊敬说法是？","promptKo":"‘부모’를 높여 부르는 말로 알맞은 것을 고르세요.","promptZh":"“父母”对应的尊敬说法是？","options":["부모님","친구","형제","아이"],"answer":0,"explanation":"부모님 中的 님 含有尊敬意味。"},{"id":"3-2","type":"语法","difficulty":"基础","prompt":"이분은 ___ 어머니예요.（这位是我妈妈）","promptKo":"빈칸에 알맞은 말을 고르세요. 이분은 ___ 어머니예요.","promptZh":"请选择合适的词：这位是我妈妈。","options":["저","제","제가","저를"],"answer":1,"explanation":"제 是 저의 的缩写，直接修饰名词。"},{"id":"3-3","type":"语法","difficulty":"TOPIK","prompt":"민수 씨는 친절하___ 재미있어요.","promptKo":"빈칸에 알맞은 연결 표현을 고르세요. 민수 씨는 친절하___ 재미있어요.","promptZh":"请选择合适的连接表达：敏洙既亲切又有趣。","options":["지만","고","아서","려고"],"answer":1,"explanation":"两个正面性质平等并列，用 -고。"},{"id":"3-4","type":"阅读","difficulty":"TOPIK","prompt":"下列哪一位不是材料中提到的家人？","promptKo":"자료에서 언급하지 않은 가족을 고르세요.","promptZh":"下列哪一位不是材料中提到的家人？","options":["아버지","어머니","누나","남동생"],"answer":3,"explanation":"四口人是本人、父母和姐姐，没有弟弟。","material":"제 가족은 네 명입니다. 부모님하고 누나가 있습니다.","materialLabel":"阅读材料"},{"id":"3-5","type":"听力","difficulty":"TOPIK","prompt":"对话中的朋友有什么特点？","promptKo":"대화를 듣고 친구의 특징으로 알맞은 것을 고르세요.","promptZh":"对话中的朋友有什么特点？","options":["漂亮但不亲切","亲切而且有趣","安静但无趣","高而且忙"],"answer":1,"explanation":"친절하고 재미있어요 表示“亲切而且有趣”。","audio":"제 친구는 친절하고 재미있어요."}]},{"id":4,"ko":"음식","zh":"饮食","color":"#4fb5bd","goal":"点餐、表达喜好、使用数量单位","topikTargets":["食品词汇","宾格助词 을/를","固有数词与量词"],"words":[{"ko":"음식","zh":"食物","romanization":"eumsik","pos":"名词"},{"ko":"밥","zh":"饭","romanization":"bap","pos":"名词"},{"ko":"김치","zh":"泡菜","romanization":"gimchi","pos":"名词"},{"ko":"물","zh":"水","romanization":"mul","pos":"名词"},{"ko":"맛있다","zh":"好吃","romanization":"masitda","pos":"形容词"},{"ko":"주세요","zh":"请给我","romanization":"juseyo","pos":"表达"},{"ko":"불고기","zh":"烤肉","romanization":"bulgogi","pos":"名词"},{"ko":"비빔밥","zh":"拌饭","romanization":"bibimbap","pos":"名词"}],"grammar":[{"form":"N을/를 주세요","title":"礼貌请求物品","meaning":"在商店或餐厅请求对方给某物，相当于“请给我……”。","formation":["名词有收音：N + 을 주세요","名词无收音：N + 를 주세요","数量表达通常放在名词后：커피 두 잔"],"usage":"点餐、购物、请求递给物品。주세요 本身来自 주다 的敬语请求形式。","examples":[{"ko":"비빔밥 하나 주세요.","zh":"请给我一份拌饭。"},{"ko":"물 두 병 주세요.","zh":"请给我两瓶水。"}],"pitfall":"量词要和物品匹配：잔（杯）、병（瓶）、개（个）、그릇（碗）。不要把汉字数词和固有量词随意混用。","comparison":"V-아/어 주세요 是请求对方做某动作：천천히 말해 주세요（请慢点说）。","topikTip":"TOPIK I 常把物品、数量、量词组合起来考。先判断量词，再选择数词形式。"},{"form":"N을/를 좋아해요","title":"表达喜好","meaning":"表示喜欢某个对象。喜欢的对象用宾格助词 을/를。","formation":["名词有收音：N + 을 좋아해요","名词无收音：N + 를 좋아해요","否定：좋아하지 않아요 / 안 좋아해요"],"usage":"谈论喜欢的食物、运动、音乐或人物。","examples":[{"ko":"저는 한국 음식을 좋아해요.","zh":"我喜欢韩国料理。"},{"ko":"동생은 커피를 안 좋아해요.","zh":"弟弟/妹妹不喜欢咖啡。"}],"pitfall":"좋아요 是“好、不错”，좋아해요 是“喜欢”。回答“你喜欢什么？”时应使用 좋아해요。","comparison":"N이/가 좋아요 也能表达“我喜欢N”，结构不同：저는 사과가 좋아요。","topikTip":"选择题中经常用 좋아요/좋아해요 干扰。看前面是否有喜好对象 을/를。"}],"questions": const el=id=>document.getElementById(id),book=()=>books[volume],lesson=()=>book().lessons[active],key=()=>book().volume+'-'+lesson().id,qs=()=>{const all=lesson().questions,wrong=all.filter(x=>mistakes.includes(x.id));return review&&wrong.length?wrong:all};function save(){localStorage.setItem('ys-v3-done',JSON.stringify(done));localStorage.setItem('ys-v3-mistakes',JSON.stringify(mistakes));localStorage.setItem('ys-v3-answers',JSON.stringify(answers));localStorage.setItem('ys-v4-exam-selections',JSON.stringify(examSelections));localStorage.setItem('ys-v4-exam-checked',JSON.stringify(examChecked));localStorage.setItem('ys-v4-exam-writings',JSON.stringify(examWritings))}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ko-KR';u.rate=.82;speechSynthesis.speak(u)}
function renderBooks(){el('books').innerHTML=books.map((b,i)=>'<button onclick="chooseBook('+i+')" class="book live '+(i===volume?'selected':'')+'"><span>0'+b.volume+'</span><b>'+b.title+'</b><small>'+b.topikStage+' · 每课 '+b.lessons[0].questions.length+'题</small></button>').join('')}
function renderMap(){const b=book(),finished=done.filter(x=>x.startsWith(b.volume+'-')).length;el('lessons').innerHTML=b.lessons.map((l,i)=>'<button class="lesson '+(i===active?'active':'')+'" style="--c:'+l.color+'" onclick="choose('+i+')"><span>'+String(l.id).padStart(2,'0')+'</span><div><b>'+l.ko+'</b><small>'+l.zh+' · '+l.questions.length+'题</small></div>'+(done.includes(b.volume+'-'+l.id)?'<i>✓</i>':'')+'</button>').join('');el('progress').textContent='第 '+b.volume+' 册 · '+finished+'/10 课 · 错题 '+mistakes.length;el('mapEyebrow').textContent='BOOK '+String(b.volume).padStart(2,'0')+' · 10 LESSONS';el('mapTitle').textContent='第 '+b.volume+' 册课程地图';el('mapDesc').textContent='每课包含词汇、详细语法和 '+b.lessons[0].questions.length+' 道分层练习。';el('stage').textContent=b.topikStage;el('wordMetric').textContent=b.lessons.reduce((s,l)=>s+l.words.length,0);el('grammarMetric').textContent=b.lessons.reduce((s,l)=>s+l.grammar.length,0);el('questionMetric').textContent=b.lessons.reduce((s,l)=>s+l.questions.length,0)}
function chooseBook(i){volume=i;active=0;tab='words';card=0;flip=false;qidx=0;selected=null;review=false;examStarted=false;examSection=0;examIndex=0;render();renderExamIntro();setTimeout(()=>document.querySelector('.map').scrollIntoView({behavior:'smooth'}),0)}
function choose(i){active=i;tab='words';card=0;flip=false;qidx=0;selected=null;review=false;render();setTimeout(()=>el('study').scrollIntoView({behavior:'smooth'}),0)}function setTab(t){tab=t;selected=null;render()}function toggleDone(){const id=key();done=done.includes(id)?done.filter(x=>x!==id):done.concat(id);save();render()}
function render(){const l=lesson(),k=key();document.documentElement.style.setProperty('--lesson',l.color);el('big').textContent=String(l.id).padStart(2,'0');el('label').textContent='BOOK '+book().volume+' · LESSON '+l.id;el('ko').textContent=l.ko;el('zh').textContent=l.zh;el('goal').textContent=l.goal;el('targets').innerHTML=l.topikTargets.map(x=>'<span>✓ '+x+'</span>').join('');el('complete').className='complete'+(done.includes(k)?' done':'');el('complete').textContent=done.includes(k)?'✓ 已完成本课':'标记本课完成';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));renderBooks();renderMap();renderPanel()}
function renderPanel(){const l=lesson(),p=el('panel');if(tab==='words'){const w=l.words[card];p.innerHTML='<div class="flash" onclick="flipCard()"><span class="count">'+(card+1)+' / '+l.words.length+'</span><button class="sound" onclick="event.stopPropagation();speak(\''+w.ko+'\')">♪</button><strong>'+(flip?w.zh:w.ko)+'</strong><small>'+(flip?w.ko+' · '+(w.pos||''):w.romanization)+'</small><em>点击翻面</em></div><div class="controls"><button onclick="prev()">← 上一个</button><button onclick="next()">下一个 →</button></div>'}else if(tab==='grammar'){p.innerHTML='<div class="grammar">'+l.grammar.map((g,i)=>'<article><span class="gnum">0'+(i+1)+'</span><div><span class="eyebrow">'+g.title+' · TOPIK 高频</span><h3>'+g.form+'</h3><p class="meaning">'+g.meaning+'</p><div class="ggrid"><section><h4>接续规则</h4>'+g.formation.map(x=>'<p>• '+x+'</p>').join('')+'</section><section><h4>什么时候用</h4><p>'+g.usage+'</p></section></div>'+g.examples.map(x=>'<button class="example" onclick="speak(\''+x.ko+'\')"><span>♪</span><b>'+x.ko+'</b><small>'+x.zh+'</small></button>').join('')+'<div class="notes"><p><b>易错点</b>'+g.pitfall+'</p>'+(g.comparison?'<p><b>对比记忆</b>'+g.comparison+'</p>':'')+'<p class="tip"><b>TOPIK 提示</b>'+g.topikTip+'</p></div></div></article>').join('')+'</div>'}else renderQuiz()}
function renderQuiz(){const l=lesson(),list=qs(),item=list[Math.min(qidx,list.length-1)],score=l.questions.filter(x=>answers[x.id]).length;p=el('panel');p.innerHTML='<div class="quiztop"><div><span>得分 <b>'+score+'/'+l.questions.length+'</b></span><span>错题 <b>'+l.questions.filter(x=>mistakes.includes(x.id)).length+'</b></span></div><b>'+(review?'错题复练':'本课分层测试')+'</b></div><div class="qnav">'+list.map((x,i)=>'<button onclick="goQ('+i+')" class="'+(i===qidx?'current ':'')+(answers[x.id]?'ok':mistakes.includes(x.id)?'bad':'')+'">'+(i+1)+'</button>').join('')+'</div><div class="question"><div class="qmeta"><span>'+item.type+'</span><span>'+item.difficulty+'</span></div>'+(item.audio?'<button class="audio" onclick="speak(\''+item.audio+'\')">♪ 播放题目音频</button>':'')+(item.material?'<section class="qmaterial"><span>'+(item.materialLabel||'题目材料')+'</span><p>'+item.material+'</p></section>':'')+'<section class="qstem"><span>문제 · 问题</span><h3 class="stemko">'+item.promptKo+'</h3><p class="stemzh">'+item.promptZh+'</p></section><div class="answers">'+item.options.map((x,i)=>'<button data-opt="'+i+'" onclick="answerQ('+i+')">'+String.fromCharCode(65+i)+'　'+x+'</button>').join('')+'</div><div id="feedback"></div></div><div class="qactions"><button onclick="resetQuiz()">重做本课</button><button onclick="toggleReview()" '+(l.questions.some(x=>mistakes.includes(x.id))?'':'disabled')+'>'+(review?'返回全部题':'只练错题')+'</button></div>';if(selected!==null)showResult(item)}
function flipCard(){flip=!flip;renderPanel()}function prev(){card=(card-1+lesson().words.length)%lesson().words.length;flip=false;renderPanel()}function next(){card=(card+1)%lesson().words.length;flip=false;renderPanel()}function goQ(i){qidx=i;selected=null;renderPanel()}function answerQ(i){if(selected!==null)return;selected=i;const item=qs()[qidx],ok=i===item.answer;answers[item.id]=ok;mistakes=ok?mistakes.filter(x=>x!==item.id):mistakes.includes(item.id)?mistakes:mistakes.concat(item.id);save();showResult(item);renderMap()}
function showResult(item){document.querySelectorAll('[data-opt]').forEach((b,i)=>{b.disabled=true;if(i===item.answer)b.classList.add('correct');else if(i===selected)b.classList.add('wrong')});el('feedback').innerHTML='<div class="feedback"><b>'+(selected===item.answer?'정답! 回答正确':'需要复习')+'</b>　'+item.explanation+'<button onclick="nextQ()">下一题 →</button></div>'}function nextQ(){selected=null;qidx=(qidx+1)%qs().length;renderPanel()}function toggleReview(){review=!review;qidx=0;selected=null;renderPanel()}function resetQuiz(){lesson().questions.forEach(x=>delete answers[x.id]);qidx=0;selected=null;save();renderPanel()}
function currentExam(){return bookExams[volume]}function currentExamSection(){return currentExam().sections[examSection]}function currentExamQuestion(){return currentExamSection().questions[examIndex]}
function renderExamIntro(){const e=currentExam();el('examIntro').innerHTML='<div><span class="eyebrow">BOOK '+String(e.volume).padStart(2,'0')+' · FINAL TEST</span><h2>'+e.title+'</h2><p>全部使用新材料，与每课练习自动查重；题型按 '+e.standard+' 组织。</p></div><div class="offexamstats"><span><b>'+e.totalQuestions+'</b>题</span><span><b>'+e.totalMinutes+'</b>分钟</span><span><b>'+e.sections.length+'</b>科目</span></div><button onclick="startExam()">'+(examStarted?'继续综合测试':'开始综合测试')+' →</button>';el('examWorkspace').style.display=examStarted?'grid':'none';if(examStarted)renderExam()}
function startExam(){examStarted=true;renderExamIntro();setTimeout(()=>el('examWorkspace').scrollIntoView({behavior:'smooth'}),0)}function pickExamSection(i){examSection=i;examIndex=0;renderExam()}function goExam(i){examIndex=i;renderExam()}function selectExam(i){const q=currentExamQuestion();if(examChecked.includes(q.id))return;examSelections[q.id]=i;save();renderExam()}function confirmExam(){const q=currentExamQuestion();if(examSelections[q.id]===undefined)return;if(!examChecked.includes(q.id))examChecked.push(q.id);save();renderExam()}function nextExam(){examIndex=Math.min(examIndex+1,currentExamSection().questions.length-1);renderExam()}function writeExam(v){examWritings[currentExamQuestion().id]=v;save();el('writeCount').textContent=v.length+' 字'}function toggleExamGuide(){const id=currentExamQuestion().id;examRevealed=examRevealed.includes(id)?examRevealed.filter(x=>x!==id):examRevealed.concat(id);renderExam()}
function renderExam(){const e=currentExam(),s=currentExamSection(),q=currentExamQuestion(),choices=e.sections.flatMap(x=>x.questions).filter(x=>x.format==='choice'),correct=choices.filter(x=>examChecked.includes(x.id)&&examSelections[x.id]===x.answer).length;el('examSections').innerHTML='<span class="eyebrow">EXAM SECTIONS</span>'+e.sections.map((x,i)=>'<button class="'+(i===examSection?'active':'')+'" onclick="pickExamSection('+i+')"><b>'+x.title+'</b><small>'+x.questions.length+'题 · '+x.timeMinutes+'分钟</small></button>').join('')+'<div class="offscore"><small>客观题答对</small><b>'+correct+'/'+choices.length+'</b></div>';let body='<div class="offexamtoolbar"><b>'+s.title+' · 第 '+(examIndex+1)+' 题</b><small>建议用时 '+s.timeMinutes+' 分钟</small></div><div class="offnumbers">'+s.questions.map((x,i)=>'<button class="'+(i===examIndex?'current ':'')+((examChecked.includes(x.id)||examWritings[x.id])?'answered':'')+'" onclick="goExam('+i+')">'+(i+1)+'</button>').join('')+'</div><article class="question"><div class="qmeta"><span>'+s.title+'</span><span>'+q.family+'</span></div>'+(q.audio?'<button class="audio" onclick="speak(currentExamQuestion().audio)">♪ 播放听力材料</button>':'')+(q.material?'<section class="qmaterial"><span>题目材料</span><p>'+q.material+'</p></section>':'')+'<section class="qstem"><span>문제 · 问题</span><h3 class="stemko">'+q.promptKo+'</h3><p class="stemzh">'+q.promptZh+'</p></section>';if(q.format==='choice'){const checked=examChecked.includes(q.id);body+='<div class="answers">'+q.options.map((x,i)=>'<button onclick="selectExam('+i+')" class="'+(checked?(i===q.answer?'correct':examSelections[q.id]===i?'wrong':''):examSelections[q.id]===i?'picked':'')+'">'+(i+1)+'　'+x+'</button>').join('')+'</div>'+(checked?'<div class="feedback">'+q.explanation+'</div>':'')+'<div class="offactions"><button onclick="confirmExam()">确认答案</button><button onclick="nextExam()">下一题 →</button></div>'}else{const value=examWritings[q.id]||'';body+='<textarea class="offwriting" oninput="writeExam(this.value)" placeholder="请在这里输入韩语答案……">'+value+'</textarea><small id="writeCount">'+value.length+' 字 · 要求 '+q.minLength+'–'+q.maxLength+' 字</small><div class="offactions"><button onclick="toggleExamGuide()">'+(examRevealed.includes(q.id)?'隐藏参考':'查看参考与评分标准')+'</button><button onclick="nextExam()">下一题 →</button></div>'+(examRevealed.includes(q.id)?'<div class="offguide"><b>参考答案/结构</b><p>'+q.sampleAnswer+'</p><b>评分标准</b><p>'+q.rubric+'</p></div>':'')}body+='</article>';el('examPaper').innerHTML=body}
renderBooks();render();renderExamIntro();
